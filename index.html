<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lekora</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; background: #f2f2f7; margin: 0; padding: 0; color: #1c1c1e; }

        /* DEMO BAR */
        .demo-bar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: #1e293b; display: flex; align-items: center; justify-content: space-between; padding: 0.375rem 0.875rem; font-size: 0.75rem; }
        .demo-bar-label { color: #64748b; font-weight: 500; }
        .demo-bar-btns { display: flex; gap: 0.375rem; }
        .demo-btn { padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.6875rem; font-weight: 600; cursor: pointer; border: none; color: white; transition: background 0.15s; }

        /* TOP HEADER */
        .top-header { position: fixed; top: 2rem; left: 0; right: 0; z-index: 90; background: rgba(242,242,247,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.1); padding: 0.75rem 1rem; display: flex; align-items: center; min-height: 3.25rem; }
        .top-header-back { color: #007aff; font-size: 1rem; background: none; border: none; cursor: pointer; padding: 0.25rem 0.5rem 0.25rem 0; display: flex; align-items: center; gap: 0.25rem; font-size: 0.9375rem; white-space: nowrap; }
        .top-header-title { font-size: 1.0625rem; font-weight: 700; color: #1c1c1e; flex: 1; text-align: center; }
        .top-header-action { color: #007aff; font-size: 0.9375rem; font-weight: 600; background: none; border: none; cursor: pointer; padding: 0.25rem 0 0.25rem 0.5rem; white-space: nowrap; }
        .top-header-spacer { width: 4rem; }

        /* CONTENT */
        .content { padding-top: 5.5rem; padding-bottom: 5.5rem; min-height: 100vh; }
        .content-inner { padding: 0.75rem 1rem; }

        /* BOTTOM NAV */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 90; background: rgba(249,249,249,0.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid rgba(0,0,0,0.12); display: flex; padding: 0.25rem 0 0.75rem; }
        .nav-tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.2rem; padding: 0.375rem 0.25rem; cursor: pointer; border: none; background: none; }
        .nav-tab-icon { font-size: 1.375rem; line-height: 1; }
        .nav-tab-label { font-size: 0.625rem; font-weight: 500; color: #8e8e93; }
        .nav-tab.active .nav-tab-icon { filter: none; }
        .nav-tab.active .nav-tab-label { color: #007aff; font-weight: 600; }

        /* CARDS */
        .card { background: white; border-radius: 0.75rem; margin-bottom: 0.75rem; overflow: hidden; }
        .card-row { display: flex; align-items: center; padding: 0.875rem 1rem; border-bottom: 1px solid #f2f2f7; gap: 0.75rem; }
        .card-row:last-child { border-bottom: none; }
        .card-section-title { font-size: 0.8125rem; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: 0.04em; padding: 0.75rem 1rem 0.375rem; }

        /* STAT GRID */
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.625rem; margin-bottom: 0.75rem; }
        .stat-card { background: white; border-radius: 0.75rem; padding: 1rem; }
        .stat-label { font-size: 0.8125rem; color: #6b7280; font-weight: 500; margin-bottom: 0.25rem; }
        .stat-value { font-size: 2rem; font-weight: 700; line-height: 1; }

        /* REFERRAL CARD */
        .ref-card { background: white; border-radius: 0.75rem; margin-bottom: 0.625rem; padding: 1rem; }
        .ref-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 0.5rem; }
        .ref-card-vendor { font-weight: 600; font-size: 1rem; color: #1c1c1e; }
        .ref-card-type { font-size: 0.8125rem; font-weight: 600; color: #007aff; margin-top: 0.125rem; }
        .ref-card-client { font-size: 0.875rem; color: #48484a; margin-top: 0.375rem; }
        .ref-card-property { font-size: 0.8125rem; color: #8e8e93; margin-top: 0.25rem; }
        .ref-card-desc { font-size: 0.875rem; color: #48484a; margin-top: 0.5rem; background: #f9f9f9; border-radius: 0.5rem; padding: 0.625rem 0.75rem; }
        .ref-card-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 0.625rem; padding-top: 0.625rem; border-top: 1px solid #f2f2f7; }

        /* VENDOR CARD */
        .vendor-card { background: white; border-radius: 0.75rem; margin-bottom: 0.625rem; padding: 1rem; display: flex; align-items: flex-start; gap: 0.875rem; }
        .vendor-avatar { width: 2.75rem; height: 2.75rem; background: #e8faf8; border-radius: 0.625rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 700; color: #0d9488; font-size: 1rem; }
        .vendor-name { font-weight: 600; font-size: 0.9375rem; color: #1c1c1e; }
        .vendor-type { font-size: 0.8125rem; font-weight: 600; color: #007aff; margin-top: 0.125rem; }
        .vendor-contact { font-size: 0.8125rem; color: #8e8e93; margin-top: 0.375rem; line-height: 1.6; }

        /* BADGES */
        .badge { display: inline-flex; align-items: center; padding: 0.2rem 0.6rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
        .badge-contacted { background: #dbeafe; color: #1d4ed8; }
        .badge-in_progress { background: #fef3c7; color: #b45309; }
        .badge-completed { background: #dcfce7; color: #15803d; }
        .badge-declined { background: #fee2e2; color: #b91c1c; }
        .badge-pending { background: #f3f4f6; color: #6b7280; }
        .badge-active { background: #d1fae5; color: #065f46; }
        .badge-client-req { background: #ede9fe; color: #6d28d9; }

        /* BUTTONS */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.375rem; border-radius: 0.625rem; font-weight: 600; cursor: pointer; border: none; transition: opacity 0.15s; font-family: inherit; }
        .btn:active { opacity: 0.75; }
        .btn-primary { background: #007aff; color: white; }
        .btn-secondary { background: #e5e5ea; color: #1c1c1e; }
        .btn-danger { background: #fee2e2; color: #b91c1c; }
        .btn-full { width: 100%; padding: 0.875rem; font-size: 1rem; border-radius: 0.75rem; }
        .btn-md { padding: 0.5rem 1rem; font-size: 0.9375rem; }
        .btn-sm { padding: 0.375rem 0.75rem; font-size: 0.8125rem; }
        .btn-teal { background: #0d9488; color: white; }

        /* FORMS */
        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; font-size: 0.875rem; font-weight: 600; color: #48484a; margin-bottom: 0.375rem; }
        .form-input, .form-select, .form-textarea { width: 100%; border: 1px solid #d1d1d6; border-radius: 0.625rem; padding: 0.75rem; font-size: 1rem; outline: none; font-family: inherit; background: white; color: #1c1c1e; -webkit-appearance: none; appearance: none; }
        .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: #007aff; box-shadow: 0 0 0 3px rgba(0,122,255,0.15); }
        .form-textarea { resize: vertical; }
        .form-card { background: white; border-radius: 0.75rem; padding: 1.125rem; margin-bottom: 0.75rem; }
        .form-hint { font-size: 0.8125rem; color: #8e8e93; margin-top: 0.375rem; }
        .info-box { background: #eff6ff; border-radius: 0.625rem; padding: 0.875rem; font-size: 0.8125rem; color: #1d4ed8; line-height: 1.5; margin-bottom: 1rem; }

        /* MODAL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: flex-end; justify-content: center; z-index: 200; }
        .modal { background: white; border-radius: 1.25rem 1.25rem 0 0; padding: 1.5rem 1.25rem 2.5rem; width: 100%; max-height: 90vh; overflow-y: auto; }
        .modal-handle { width: 2.5rem; height: 0.25rem; background: #d1d1d6; border-radius: 9999px; margin: 0 auto 1.25rem; }
        .modal-title { font-size: 1.125rem; font-weight: 700; color: #1c1c1e; margin-bottom: 0.375rem; }
        .modal-subtitle { font-size: 0.875rem; color: #8e8e93; margin-bottom: 1.25rem; line-height: 1.5; }

        /* TOAST */
        .toast { position: fixed; bottom: 5.5rem; left: 1rem; right: 1rem; background: #1c1c1e; color: white; padding: 0.875rem 1rem; border-radius: 0.75rem; font-size: 0.9rem; z-index: 300; box-shadow: 0 8px 24px rgba(0,0,0,0.3); animation: toastIn 0.25s ease; text-align: center; }
        @keyframes toastIn { from { transform: translateY(1rem); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* MISC */
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.625rem; }
        .section-title { font-size: 1.0625rem; font-weight: 700; color: #1c1c1e; }
        .empty-state { text-align: center; padding: 3rem 1rem; color: #8e8e93; }
        .chip-row { display: flex; gap: 0.5rem; overflow-x: auto; padding-bottom: 0.25rem; margin-bottom: 0.75rem; scrollbar-width: none; }
        .chip-row::-webkit-scrollbar { display: none; }
        .chip { padding: 0.375rem 0.875rem; border-radius: 9999px; font-size: 0.8125rem; font-weight: 600; white-space: nowrap; cursor: pointer; border: 1.5px solid #d1d1d6; background: white; color: #48484a; }
        .chip.active { background: #007aff; border-color: #007aff; color: white; }
        .divider { height: 1px; background: #f2f2f7; margin: 0.25rem 0; }
        .feedback-box { background: #f0fdf4; border-radius: 0.625rem; padding: 0.75rem; font-size: 0.875rem; color: #166534; margin-top: 0.625rem; line-height: 1.5; }
        .select-arrow { position: relative; }
        .select-arrow::after { content: '›'; position: absolute; right: 0.875rem; top: 50%; transform: translateY(-50%) rotate(90deg); color: #8e8e93; pointer-events: none; font-size: 1.125rem; }
        .select-arrow .form-select { padding-right: 2rem; }
    </style>
</head>
<body>
<div id="root"></div>
<script>
// =============================================================================
// FAKE DATA
// =============================================================================
const db = {
    vendorTypes: ["HVAC","Painter","Roofer","Plumber","Electrician","Landscaper","Carpenter","Inspector","Flooring","General Contractor"],
    propertyStatuses: { currently_owned:"Currently Owned", purchasing:"Purchasing", under_contract:"Under Contract", sold:"Sold", rental:"Rental" },
    vendors: [
        { id:1, name:"Tom's Roofing & Repair", type:"Roofer", phone:"503-555-0101", email:"tom@tomsroofing.com", smsCapable:true, status:"active", addedBy:"Sarah Mitchell" },
        { id:2, name:"City HVAC Services", type:"HVAC", phone:"503-555-0102", email:"info@cityhvac.com", smsCapable:true, status:"active", addedBy:"Sarah Mitchell" },
        { id:3, name:"Premier Painting Co.", type:"Painter", phone:"503-555-0103", email:"hello@premierpainting.com", smsCapable:false, status:"active", addedBy:"Michael Torres" },
        { id:4, name:"Ace Plumbing Solutions", type:"Plumber", phone:"503-555-0104", email:"ace@aceplumbing.com", smsCapable:true, status:"active", addedBy:"Sarah Mitchell" },
        { id:5, name:"Bright Electric", type:"Electrician", phone:"503-555-0105", email:"info@brightelectric.com", smsCapable:true, status:"active", addedBy:"Jennifer Park" },
        { id:6, name:"Pacific Landscaping", type:"Landscaper", phone:"503-555-0106", email:"pacific@landscaping.com", smsCapable:true, status:"pending", addedBy:"Sarah Mitchell" },
    ],
    clients: [
        { id:1, name:"James & Linda Chen", email:"james.chen@email.com", phone:"503-555-1001", properties:[
            { id:1, address:"142 Oak Street, Portland, OR 97201", status:"currently_owned" },
            { id:2, address:"8821 Maple Ave, Lake Oswego, OR 97034", status:"purchasing" },
        ]},
        { id:2, name:"Marcus Williams", email:"m.williams@email.com", phone:"503-555-1002", properties:[
            { id:3, address:"5503 Pine Rd, Beaverton, OR 97005", status:"currently_owned" },
        ]},
        { id:3, name:"Rachel Torres", email:"rachel.torres@email.com", phone:"503-555-1003", properties:[
            { id:4, address:"99 Birch Lane, Portland, OR 97204", status:"rental" },
            { id:5, address:"220 Cedar Blvd, Tigard, OR 97223", status:"currently_owned" },
        ]},
    ],
    referrals: [
        { id:1, agentId:"sarah", clientId:1, vendorId:1, propertyId:1, status:"in_progress", jobValue:8500, description:"Full roof replacement, approx. 2,000 sq ft. Some storm damage on south-facing slope.", date:"2026-04-15", initiatedBy:"agent", feedback:null },
        { id:2, agentId:"sarah", clientId:1, vendorId:2, propertyId:2, status:"contacted", jobValue:3200, description:"New HVAC system installation for 3BR home. Client wants high-efficiency unit.", date:"2026-04-28", initiatedBy:"agent", feedback:null },
        { id:3, agentId:"sarah", clientId:2, vendorId:3, propertyId:3, status:"completed", jobValue:2100, description:"Interior painting — 3 bedrooms, living room, and hallway. Neutral tones preferred.", date:"2026-03-10", initiatedBy:"agent", feedback:{ text:"Premier Painting did a fantastic job. Very clean work, finished ahead of schedule.", left:true } },
        { id:4, agentId:"sarah", clientId:3, vendorId:4, propertyId:4, status:"declined", jobValue:null, description:"Kitchen sink repair — slow drain and minor leak under cabinet.", date:"2026-04-02", initiatedBy:"client", feedback:{ text:"They never showed up for the estimate. Would not recommend.", left:true } },
        { id:5, agentId:"sarah", clientId:3, vendorId:5, propertyId:4, status:"contacted", jobValue:1800, description:"Electrical panel upgrade from 100A to 200A service.", date:"2026-04-30", initiatedBy:"agent", feedback:null },
    ],
};

// =============================================================================
// STATE
// =============================================================================
let state = {
    role: "agent",
    screen: "dashboard",
    params: {},
    modal: null,
    toast: null,
    newReferral: {},
    newVendor: {},
    newClient: {},
};

// =============================================================================
// HELPERS
// =============================================================================
const getVendor = id => db.vendors.find(v => v.id === id);
const getClient = id => db.clients.find(c => c.id === id);
const getProp   = (cid, pid) => getClient(cid)?.properties.find(p => p.id === pid);

function badge(status) {
    const labels = { contacted:"Contacted", in_progress:"In Progress", completed:"Completed", declined:"Declined", pending:"Pending", active:"Active" };
    return `<span class="badge badge-${status}">${labels[status] || status}</span>`;
}
function fmt(d) { return new Date(d).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}); }
function money(v) { return v ? "$"+v.toLocaleString() : "—"; }

function showToast(msg) {
    state.toast = msg;
    render();
    setTimeout(() => { state.toast = null; render(); }, 3000);
}
function go(screen, params={}) {
    state.screen = screen;
    state.params = params;
    state.modal = null;
    window.scrollTo(0,0);
    render();
}
function switchRole(role) {
    state.role = role;
    state.screen = role==="agent" ? "dashboard" : role==="vendor" ? "vendor-jobs" : "client-referrals";
    state.modal = null;
    render();
}

// =============================================================================
// CHROME
// =============================================================================
function demBar() {
    return `<div class="demo-bar">
        <span class="demo-bar-label">🎭 Demo</span>
        <div class="demo-bar-btns">
            ${["agent","vendor","client"].map(r=>`<button class="demo-btn" onclick="switchRole('${r}')" style="background:${state.role===r?"#0d9488":"#334155"}">${r.charAt(0).toUpperCase()+r.slice(1)}</button>`).join("")}
        </div>
    </div>`;
}

// Per-screen header config
const headerConfigs = {
    dashboard:        { title:"Lekora",         back:null,        action:{ label:"+ Referral", screen:"referrals/new" } },
    referrals:        { title:"Referrals",       back:null,        action:{ label:"+ New",      screen:"referrals/new" } },
    "referrals/new":  { title:"New Referral",    back:"referrals", action:null },
    vendors:          { title:"Vendors",         back:null,        action:{ label:"+ Add",      screen:"vendors/new" } },
    "vendors/new":    { title:"Add Vendor",      back:"vendors",   action:null },
    clients:          { title:"Clients",         back:null,        action:{ label:"+ Add", screen:"clients/new" } },
    "clients/new":    { title:"New Client",      back:"clients",   action:null },
    "vendor-jobs":    { title:"My Jobs",         back:null,        action:null },
    "client-referrals":{ title:"My Referrals",  back:null,        action:null },
    "client-browse":  { title:"Find a Vendor",  back:null,        action:null },
};

function topHeader() {
    const cfg = headerConfigs[state.screen] || { title:"", back:null, action:null };
    const left = cfg.back
        ? `<button class="top-header-back" onclick="go('${cfg.back}')">‹ Back</button>`
        : `<div class="top-header-spacer"></div>`;
    const right = cfg.action
        ? `<button class="top-header-action" onclick="go('${cfg.action.screen}')">${cfg.action.label}</button>`
        : `<div class="top-header-spacer"></div>`;
    return `<div class="top-header">${left}<div class="top-header-title">${cfg.title}</div>${right}</div>`;
}

function bottomNav() {
    const tabs = {
        agent:  [
            { icon:"🏠", label:"Home",     screen:"dashboard" },
            { icon:"↔️",  label:"Referrals",screen:"referrals" },
            { icon:"🏪",  label:"Vendors",  screen:"vendors" },
            { icon:"👥",  label:"Clients",  screen:"clients" },
        ],
        vendor: [
            { icon:"📋",  label:"My Jobs",  screen:"vendor-jobs" },
        ],
        client: [
            { icon:"↔️",  label:"Referrals",screen:"client-referrals" },
            { icon:"🔍",  label:"Find",     screen:"client-browse" },
        ],
    };
    return `<div class="bottom-nav">
        ${(tabs[state.role]||[]).map(t=>`
        <button class="nav-tab ${state.screen===t.screen||state.screen===t.screen+"/new"?"active":""}" onclick="go('${t.screen}')">
            <span class="nav-tab-icon">${t.icon}</span>
            <span class="nav-tab-label" style="${state.screen===t.screen||state.screen===t.screen+"/new"?"color:#007aff":""}">${t.label}</span>
        </button>`).join("")}
    </div>`;
}

// =============================================================================
// AGENT: DASHBOARD
// =============================================================================
function screenDashboard() {
    const refs = db.referrals;
    const active = refs.filter(r=>["contacted","in_progress"].includes(r.status)).length;
    const completed = refs.filter(r=>r.status==="completed").length;
    const recent = [...refs].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,3);
    return `
    <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Total Referrals</div><div class="stat-value" style="color:#1c1c1e">${refs.length}</div></div>
        <div class="stat-card"><div class="stat-label">Active Jobs</div><div class="stat-value" style="color:#007aff">${active}</div></div>
        <div class="stat-card"><div class="stat-label">Completed</div><div class="stat-value" style="color:#15803d">${completed}</div></div>
        <div class="stat-card"><div class="stat-label">Vendors</div><div class="stat-value" style="color:#1c1c1e">${db.vendors.length}</div></div>
    </div>

    <div class="section-header">
        <div class="section-title">Recent Referrals</div>
        <button onclick="go('referrals')" style="color:#007aff;font-size:0.875rem;font-weight:600;background:none;border:none;cursor:pointer;">See all</button>
    </div>

    ${recent.map(r => {
        const v=getVendor(r.vendorId), c=getClient(r.clientId), p=getProp(r.clientId,r.propertyId);
        return `<div class="ref-card">
            <div class="ref-card-top">
                <div>
                    <div class="ref-card-vendor">${v?.name}</div>
                    <div class="ref-card-type">${v?.type}</div>
                </div>
                ${badge(r.status)}
            </div>
            <div class="ref-card-client">👤 ${c?.name}</div>
            ${p?`<div class="ref-card-property">📍 ${p.address.split(",")[0]}</div>`:""}
            <div class="ref-card-footer">
                ${r.initiatedBy==="client"?'<span class="badge badge-client-req">Client Request</span>':'<span style="color:#8e8e93;font-size:0.8125rem;">Agent</span>'}
                <span style="color:#8e8e93;font-size:0.8125rem;">${fmt(r.date)}</span>
            </div>
        </div>`;
    }).join("")}`;
}

// =============================================================================
// AGENT: REFERRALS LIST
// =============================================================================
function screenReferrals() {
    return db.referrals.map(r => {
        const v=getVendor(r.vendorId), c=getClient(r.clientId), p=getProp(r.clientId,r.propertyId);
        return `<div class="ref-card">
            <div class="ref-card-top">
                <div>
                    <div class="ref-card-vendor">${v?.name}</div>
                    <div class="ref-card-type">${v?.type}</div>
                </div>
                ${badge(r.status)}
            </div>
            <div class="ref-card-client">👤 ${c?.name}</div>
            ${p?`<div class="ref-card-property">📍 ${p.address.split(",")[0]}</div>`:""}
            ${r.jobValue?`<div style="font-size:0.875rem;color:#0d9488;font-weight:600;margin-top:0.375rem;">${money(r.jobValue)}</div>`:""}
            <div class="ref-card-footer">
                ${r.initiatedBy==="client"?'<span class="badge badge-client-req">Client Request</span>':'<span style="color:#8e8e93;font-size:0.8125rem;">Agent</span>'}
                <span style="color:#8e8e93;font-size:0.8125rem;">${fmt(r.date)}</span>
            </div>
        </div>`;
    }).join("");
}

// =============================================================================
// AGENT: NEW REFERRAL
// =============================================================================
function screenNewReferral() {
    const nr = state.newReferral;
    const selClient = nr.clientId ? getClient(parseInt(nr.clientId)) : null;
    const filteredVendors = nr.vendorType ? db.vendors.filter(v=>v.type===nr.vendorType) : [];
    return `<div class="form-card">
        <div class="form-group">
            <label class="form-label">Client *</label>
            <div class="select-arrow">
                <select class="form-select" onchange="updateNR('clientId',this.value)">
                    <option value="">Select a client...</option>
                    ${db.clients.map(c=>`<option value="${c.id}" ${nr.clientId==c.id?"selected":""}>${c.name}</option>`).join("")}
                </select>
            </div>
        </div>

        ${selClient ? `<div class="form-group">
            <label class="form-label">Property <span style="color:#8e8e93;font-weight:400;">(optional)</span></label>
            <div class="select-arrow">
                <select class="form-select" onchange="updateNR('propertyId',this.value)">
                    <option value="">No specific property</option>

        "vendors/new":       screenAddVendor,
        "clients":           screenClients,
        "clients/new":       screenAddClient,
        "vendor-jobs":       screenVendorJobs,
        "client-referrals":  screenClientReferrals,
        "client-browse":     screenClientBrowse,
    };
    const content = (screens[state.screen] || screenDashboard)();

    document.getElementById("root").innerHTML = `
        ${demBar()}
        ${topHeader()}
        <div class="content"><div class="content-inner">${content}</div></div>
        ${bottomNav()}
        ${renderModal()}
        ${state.toast?`<div class="toast">${state.toast}</div>`:""}
    `;
}

render();
</script>
</body>
</html>
